<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DR53 Command Centre</title>
<style>
:root{--bg:#030711;--panel:#06101f;--panel2:#07101e;--gold:#c99a2e;--gold2:#f1ca62;--text:#f4f6fb;--mute:#9ba8bc;--line:#1b2a42}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 400px at 80% -10%,#0d1a33,transparent),var(--bg);color:var(--text);font:15px/1.5 -apple-system,system-ui,sans-serif;display:flex;min-height:100vh}
nav{width:220px;background:var(--panel);border-right:1px solid var(--line);padding:20px 12px;flex:none}
.logo{font-weight:700;letter-spacing:.08em;color:var(--gold2);padding:0 10px 20px}.logo small{display:block;color:var(--mute);font-weight:400;letter-spacing:.02em}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mute);padding:10px;border-radius:8px;font:inherit;cursor:pointer}
nav button:hover{color:var(--text)}nav button.on{background:#0d1a2e;color:var(--gold2);box-shadow:inset 2px 0 var(--gold)}
main{flex:1;padding:24px;min-width:0}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0}.pill{border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;color:var(--mute)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c0392b;margin-right:6px}.dot.ok{background:#3fb97a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px}.card b{display:block;font-size:28px;color:var(--gold2)}
.card span{color:var(--mute);font-size:13px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--mute);font-weight:500}
input,select,textarea,button.b{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px;font:inherit}
button.b{background:var(--gold);color:#1a1200;border:0;cursor:pointer;font-weight:600}button.b:hover{background:var(--gold2)}button:disabled{opacity:.65;cursor:wait}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.empty{color:var(--mute);padding:24px;text-align:center}
.msg{padding:10px 14px;border-radius:10px;margin:8px 0;max-width:80%;white-space:pre-wrap}.u{background:#0d1a2e;margin-left:auto}.a{background:var(--panel2);border:1px solid var(--line)}
.err{color:#ff8a80}.ok2{color:#7ee2a8}.subtle{color:var(--mute);font-size:13px}.actionGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:14px}.fieldGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}.fieldGrid input,.fieldGrid select,.fieldGrid textarea{width:100%;min-width:0}.consent{display:flex;align-items:flex-start;gap:9px;margin:12px 0;color:var(--mute);font-size:13px}.consent input{margin-top:4px}.wide{width:100%}.provider{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;margin:4px 0 10px}.provider.good{color:#7ee2a8;border-color:#285c45}.provider.warn{color:#ffd780;border-color:#745b20}.card h3{margin:0 0 8px}.result{padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:12px 0;white-space:pre-wrap}.result:empty{display:none}.result.good{color:#7ee2a8}.result.bad{color:#ff8a80}textarea{resize:vertical}.agentLayout{display:grid;grid-template-columns:minmax(280px,0.9fr) minmax(320px,1.1fr);gap:14px}.agentLog{height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:12px;background:#030711}.agentComposer{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.agentComposer textarea{min-height:62px;width:100%}.agentTools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.agentNotice{border:1px solid #745b20;background:#1a160b;border-radius:9px;padding:10px;color:#ffd780;font-size:13px}.liveState{font-size:13px;color:var(--mute);margin:8px 0}.primarySmall{border:1px solid var(--gold);color:var(--gold2);background:#151307;border-radius:8px;padding:8px 10px;cursor:pointer}.agentMini{display:grid;grid-template-columns:1fr 1fr;gap:8px}.agentMini input,.agentMini select{width:100%;min-width:0}@media(max-width:850px){.agentLayout{grid-template-columns:1fr}}@media(max-width:700px){body{flex-direction:column}nav{width:auto;display:flex;overflow-x:auto}main{padding:14px}table{display:block;overflow-x:auto;white-space:nowrap}}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .2s}.card:hover{transform:translateY(-2px)}}
</style></head><body>
<nav><div class="logo">DYNAMIC ROBOTICS 53<small>AI Sales Command Centre</small></div><div id="nav"></div></nav>
<main><header><h1 id="title"></h1><div><span class="pill" id="ai"><i class="dot"></i>Local AI: checking</span> <span class="pill" id="clock"></span></div></header><section id="view"></section></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(m,p,b)=>{const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json','x-dr53':'1'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j;};
const ist=d=>new Date(d).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',dateStyle:'medium',timeStyle:'short'})+' IST';
const pages={'Call & Message':calling,'Command Centre':dash,'AI Sales Agent':chat,'Manual Dialer':dialer,'Customers':custs,'Products & Pricing':prods,'Follow-ups':fups,'Callbacks':cbs,'Activity Log':act};
$('#nav').innerHTML=Object.keys(pages).map(k=>`<button>${k}</button>`).join('');
$('#nav').onclick=e=>e.target.tagName=='BUTTON'&&go(e.target.textContent);
async function go(k){if(window.stopDR53Voice&&k!=='AI Sales Agent')window.stopDR53Voice();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.textContent==k));$('#title').textContent=k;$('#view').innerHTML='<div class="empty">Loading…</div>';try{await pages[k]()}catch(e){$('#view').innerHTML=`<div class="empty err">${esc(e.message)}</div>`}}
async function dash(){const d=await api('GET','/dashboard');const c=[['Total leads',d.totalLeads],['Converted',d.converted],['New enquiries',d.newEnquiries],['Callbacks scheduled',d.callbacksScheduled],['Open tasks',d.openTasks],['Calls dialled',d.totalCalls]];
$('#view').innerHTML=`<div class="grid">${c.map(([l,v])=>`<div class="card"><b>${v}</b><span>${l}</span></div>`).join('')}</div>`+(d.totalLeads?'':'<div class="empty">No records yet. Add your first customer to get started.</div>')}
async function chat(){
  window.hist=window.hist||[];
  const [customers,products,ai]=await Promise.all([api('GET','/customers'),api('GET','/products'),api('GET','/ai/status')]);
  $('#view').innerHTML=`
  <div class="agentNotice"><strong>Free mode:</strong> Mac Phone + local Ollama. The typed agent works even if Ollama is offline (limited fallback). The voice assistant below is an <strong>experimental acoustic bridge</strong>, not a direct Phone-app integration. Use built-in Mac speakers/mic, not headphones, and test only with your own phone first. Browser speech recognition may process audio online.</div>
  <div class="agentLayout" style="margin-top:14px">
    <div class="card">
      <h3>Call a customer with the agent ready</h3>
      <p class="subtle">Enter a number, confirm you have permission to contact the person, and open your normal Mac call. After the call connects, return to this browser and start Voice Assist.</p>
      <div class="fieldGrid">
        <select id="agPick"><option value="">Choose saved customer (optional)</option>${customers.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} · ${esc(c.phone||'no phone')}</option>`).join('')}</select>
        <input id="agName" placeholder="Customer name">
        <input id="agPhone" inputmode="tel" placeholder="Phone, e.g. +919876543210">
        <input id="agProduct" placeholder="Product interest, e.g. Tap Tag Sticker">
        <input id="agPurpose" placeholder="Purpose" value="Follow up on existing enquiry">
      </div>
      <label class="consent"><input id="agConsent" type="checkbox"><span>I confirm this is an appropriate, consented follow-up. I will disclose that the voice is AI, respect any refusal, and stop when asked.</span></label>
      <button class="b wide" id="agCall">Open Mac Phone / dial customer</button>
      <div class="row"><button class="primarySmall" id="agScript">Draft call script</button><button class="primarySmall" id="agWa">Draft & open WhatsApp</button><button class="primarySmall" id="agMsg">Draft message</button></div>
      <textarea id="agDraft" rows="5" placeholder="The agent's call script or message will appear here. You can edit it before using it."></textarea>
      <div id="agActionStatus" class="result" role="status" aria-live="polite"></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
      <h3>Experimental live voice assist</h3>
      <p class="subtle">After a call is answered, return here and click Start. It listens through browser speech recognition, asks for permission to continue as an AI, requests a short answer from your local agent, and speaks through Mac speakers. Whether the caller hears that sound depends on your Mac's call audio path.</p>
      <label class="consent"><input id="agSpeechPrivacy" type="checkbox"><span>I understand browser speech recognition may process microphone audio outside this Mac. I will only activate it after the customer answers, and will stop it if audio routing is unclear.</span></label>
      <div class="row"><button class="b" id="agVoiceStart">Start AI Voice Assist (experimental)</button><button class="primarySmall" id="agVoiceStop" disabled>Stop voice assist</button></div>
      <div id="agVoiceStatus" class="liveState" aria-live="polite">Voice assist is stopped.</div>
      <div id="agTranscript" class="agentLog" style="height:160px;white-space:pre-wrap">Live transcript and AI replies will appear here.</div>
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap"><h3 style="margin:0">DR53 AI Sales Agent</h3><span class="provider ${ai.online&&ai.modelReady?'good':'warn'}">${ai.online&&ai.modelReady?'Local LLM ready':'Offline fallback active'}</span></div>
      <p class="subtle">Type normally. The agent can explain approved prices, prepare scripts, draft messages, and guide follow-up tasks. It will not pretend it sent a message or joined live call audio.</p>
      <div id="log" class="agentLog"></div>
      <div class="agentComposer"><textarea id="q" placeholder="Tell your sales assistant what you need… (e.g. draft a message for Tap Tag Sticker)" aria-label="Message the AI Sales Agent"></textarea><button class="b" id="send">Send</button></div>
      <div class="agentTools">${['Explain Tap Tag Sticker at ₹553','Draft a WhatsApp follow-up','Write a 30-second sales call script','What should I do next?','Explain the Tap Tag Card'].map(t=>`<button class="primarySmall" type="button">${esc(t)}</button>`).join('')}</div>
      <p class="subtle">If the local AI is running, it handles open-ended prompts. If it isn't, this chat uses a smaller local catalogue-aware fallback instead of just failing.</p>
    </div>
  </div>`;
  const log=$('#log'), q=$('#q');
  const draw=()=>{log.innerHTML=window.hist.map(m=>`<div class="msg ${m.role==='user'?'u':'a'}">${esc(m.content)}</div>`).join('')||'<div class="empty">Start by asking a question or choosing a prompt below.</div>';log.scrollTop=log.scrollHeight;};draw();
  const sayStatus=(id,msg,ok=false)=>{const e=$('#'+id);e.className='result '+(ok?'good':'bad');e.textContent=msg;};
  const normalPhone=v=>{let n=String(v||'').trim().replace(/[\s()\-.]/g,'');if(/^\d{10}$/.test(n))n='+91'+n;else if(/^91\d{10}$/.test(n))n='+'+n;if(!/^\+[1-9]\d{7,14}$/.test(n))throw new Error('Enter a valid phone number, such as +919876543210.');return n;};
  const catalogue=products.filter(p=>p.active!==false).map(p=>`- ${p.name}: ₹${p.price}${p.priceType==='starting'?' starting price':''}. ${p.description}`).join('\n');
  const getDraft=async(kind)=>{const name=$('#agName').value.trim()||'customer',product=$('#agProduct').value.trim()||'their enquiry',purpose=$('#agPurpose').value.trim()||'follow up on their existing enquiry';const ask=kind==='call'?`Draft a natural phone script for an AI sales assistant at Dynamic Robotics 53. Explicitly disclose you are an AI early in the call, ask if it's okay to continue, use 30 seconds maximum, one question at a time. Customer: ${name}. Product interest: ${product}. Purpose: ${purpose}. Do not invent features or policies. Catalogue:\n${catalogue}`:`Draft one concise WhatsApp follow-up for Dynamic Robotics 53. Customer: ${name}. Interest: ${product}. Purpose: ${purpose}. Under 500 characters, no fabricated features or discounts. Catalogue:\n${catalogue}`;const r=await api('POST','/chat',{messages:[{role:'user',content:ask}]});return r.reply||'';};
  $('#agPick').onchange=()=>{const c=customers.find(c=>c.id===$('#agPick').value);if(c){$('#agName').value=c.name||'';$('#agPhone').value=c.phone||'';$('#agProduct').value=c.product||'';}};
  $('#agCall').onclick=async()=>{try{if(!$('#agConsent').checked)throw new Error('Tick the consent confirmation before opening a business call.');const phone=normalPhone($('#agPhone').value);const r=await api('POST','/calls/dial',{phone,customerName:$('#agName').value,customerId:$('#agPick').value||'',purpose:$('#agPurpose').value});sayStatus('agActionStatus',r.message+' When the call is connected, return to this page and try Voice Assist. Audio pickup is experimental; first test with your own phone.',true);}catch(e){sayStatus('agActionStatus',e.message);}};
  $('#agScript').onclick=async()=>{try{$('#agDraft').value=await getDraft('call');sayStatus('agActionStatus','Call script drafted. The live mode must disclose it is AI and obtain permission before continuing.',true);}catch(e){sayStatus('agActionStatus',e.message);}};
  $('#agMsg').onclick=async()=>{try{$('#agDraft').value=await getDraft('message');sayStatus('agActionStatus','Message drafted. Review and edit it before opening a messaging app.',true);}catch(e){sayStatus('agActionStatus',e.message);}};
  $('#agWa').onclick=async()=>{let win=null;try{if(!$('#agConsent').checked)throw new Error('Confirm permission to message this customer first.');const phone=normalPhone($('#agPhone').value);win=window.open('about:blank','_blank');const message=await getDraft('message');$('#agDraft').value=message;if(win){win.location.href='https://wa.me/'+phone.replace(/\D/g,'')+'?text='+encodeURIComponent(message);}else{throw new Error('The browser blocked the new tab. Use Draft message, then open WhatsApp manually.');}sayStatus('agActionStatus','WhatsApp opened with a draft; check it and press Send yourself.',true);}catch(e){if(win)win.close();sayStatus('agActionStatus',e.message);}};
  const append=async(v)=>{if(!v.trim())return;window.hist.push({role:'user',content:v.trim()});draw();const b=$('#send');b.disabled=true;b.textContent='Thinking…';try{
      // Safe, explicit natural-language shortcuts that actually invoke supported app actions.
      const callMatch=v.match(/^\s*(?:please\s+)?(?:call|dial|phone)\s+(?:customer\s+)?(\+?\d[\d\s()\-.]{6,}\d)(.*)$/i);
      if(callMatch){if(!$('#agConsent').checked)throw new Error('Before I open the native dialer, confirm the contact permission in the left panel.');const phone=normalPhone(callMatch[1]);$('#agPhone').value=phone;$('#agPurpose').value=callMatch[2].trim()||$('#agPurpose').value;const r=await api('POST','/calls/dial',{phone,customerName:$('#agName').value,customerId:$('#agPick').value||'',purpose:$('#agPurpose').value});window.hist.push({role:'assistant',content:(r.message||'Mac Phone opened.')+' I cannot guarantee this native call carries my voice. After the call connects, try the clearly marked experimental Voice Assist panel.'});}
      else if(/^\s*(?:make|create|add)\s+(?:a\s+)?follow[ -]?up\s*:?\s*/i.test(v)){const title=v.replace(/^\s*(?:make|create|add)\s+(?:a\s+)?follow[ -]?up\s*:?\s*/i,'').trim();if(!title)throw new Error('Tell me the follow-up task after “create follow-up”.');const r=await api('POST','/followups',{title,priority:'medium'});window.hist.push({role:'assistant',content:`Done — I saved the follow-up task “${r.title}” to your Follow-ups list.`});}
      else if(/^\s*(?:draft|write|prepare)\s+(?:a\s+)?(?:whatsapp\s+)?(?:message|follow[ -]?up|call script|sales script)/i.test(v)){const r=await api('POST','/chat',{messages:[{role:'user',content:v+'\nUse only the approved Dynamic Robotics 53 catalogue. Keep it ready to review, never claim it was sent. Catalogue:\n'+catalogue}]});window.hist.push({role:'assistant',content:r.reply||'Draft completed.'});}
      else {const r=await api('POST','/chat',{messages:window.hist});window.hist.push({role:'assistant',content:r.reply||'I didn’t get a reply. Try again.'});if(r.notice)$('#ai').title=r.notice;}
    }catch(e){window.hist.push({role:'assistant',content:'I could not complete that action: '+e.message});}finally{b.disabled=false;b.textContent='Send';draw();q.focus();}};
  $('#send').onclick=()=>{const v=q.value;q.value='';append(v);};q.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const v=q.value;q.value='';append(v);}};
  document.querySelectorAll('.agentTools button').forEach(b=>b.onclick=()=>append(b.textContent));
  // Experimental acoustic call companion. The browser cannot access the Phone app's digital call stream;
  // this relies on the Mac microphone hearing the customer's voice and the Phone app picking up speaker audio.
  let voiceActive=false,voiceBusy=false,recognition=null,waitingForAIPermission=true,voiceHist=[];
  const voiceOut=$('#agTranscript');
  const voiceStatus=t=>$('#agVoiceStatus').textContent=t;
  const voiceLog=(who,txt)=>{if(voiceOut.textContent==='Live transcript and AI replies will appear here.')voiceOut.textContent='';voiceOut.textContent+=`${who}: ${txt}\n\n`;voiceOut.scrollTop=voiceOut.scrollHeight;};
  const stopVoice=()=>{voiceActive=false;voiceBusy=false;try{recognition?.stop();}catch{};recognition=null;window.speechSynthesis?.cancel();$('#agVoiceStart').disabled=false;$('#agVoiceStop').disabled=true;voiceStatus('Voice assist stopped. End the call separately in Mac Phone.');};window.stopDR53Voice=stopVoice;
  const speakAndListen=text=>{if(!voiceActive)return;voiceBusy=true;try{recognition?.stop();}catch{};window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-IN';u.rate=0.96;u.pitch=1;u.onend=()=>{if(!voiceActive)return;voiceBusy=false;voiceStatus('Listening for the customer. Keep the call on Mac speakers and microphone.');setTimeout(()=>{if(voiceActive&&recognition&&!voiceBusy){try{recognition.start();}catch{}}},650);};u.onerror=()=>{voiceBusy=false;if(voiceActive)voiceStatus('Speech output failed. Check Mac sound output and try Stop.');};window.speechSynthesis.speak(u);};
  const endOnRefusal=t=>/^\s*(?:no|nope|nah)\b/i.test(t)||/\b(no thanks|not interested|do not call|don't call|stop calling|remove me|opt out|unsubscribe|not okay|not ok|end (?:the )?call)\b/i.test(t);
  const affirmative=t=>/\b(yes|yeah|yep|sure|okay|ok|go ahead|that's fine|that is fine|you can continue|fine)\b/i.test(t);
  const handleVoiceText=async(transcript)=>{if(!voiceActive||voiceBusy)return;voiceLog('Customer',transcript);voiceStatus('Thinking…');
    if(endOnRefusal(transcript)){voiceLog('AI','Understood. I will stop here. Thank you, goodbye.');speakAndListen('Understood. I will stop here. Thank you, goodbye.');setTimeout(stopVoice,3500);return;}
    if(waitingForAIPermission){if(affirmative(transcript)){waitingForAIPermission=false;const intro='Thank you. I can briefly help with your enquiry for Dynamic Robotics 53. What would you like to know?';voiceLog('AI',intro);speakAndListen(intro);return;}const retry='I am an AI sales assistant for Dynamic Robotics 53. Is it okay if I continue this conversation as an AI assistant? You can say no at any time.';voiceLog('AI',retry);speakAndListen(retry);return;}
    voiceHist.push({role:'user',content:transcript});try{const prompt='You are currently speaking out loud with a customer on a phone call for Dynamic Robotics 53. Keep the response to at most two short natural sentences, disclose you are an AI if asked, never pretend to be human, ask one question at a time, use only the approved catalogue, do not invent specs or discounts, and immediately respect refusal. The customer has agreed to speak with an AI assistant. Customer said: '+transcript;const r=await api('POST','/chat',{messages:[...voiceHist.slice(-8),{role:'user',content:prompt}]});const reply=(r.reply||'Sorry, I did not catch that. Could you repeat it?').replace(/[*#`]/g,'').slice(0,850);voiceHist.push({role:'assistant',content:reply});voiceLog('AI',reply);speakAndListen(reply);}catch(e){const fallback='Sorry, my local sales assistant is having trouble responding. Would you like me to stop here?';voiceLog('AI',fallback);speakAndListen(fallback);}};
  $('#agVoiceStart').onclick=()=>{try{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)throw new Error('This browser does not expose Speech Recognition. Use current Google Chrome, allow microphone access, and reload.');if(!(ai.online&&ai.modelReady))throw new Error('For live AI conversation, Ollama must be running with qwen2.5:3b. In Terminal run “ollama serve” and “ollama pull qwen2.5:3b”, then refresh this page. Typed chat still has an offline fallback.');if(!$('#agConsent').checked)throw new Error('Confirm permission to contact the customer first.');if(!$('#agSpeechPrivacy').checked)throw new Error('Please acknowledge the browser speech-recognition privacy note first.');voiceActive=true;waitingForAIPermission=true;voiceHist=[];recognition=new SR();recognition.lang='en-IN';recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onresult=e=>{const transcript=Array.from(e.results).map(x=>x[0]?.transcript||'').join(' ').trim();if(transcript)handleVoiceText(transcript);};recognition.onerror=e=>{if(!voiceActive)return;voiceStatus('Speech recognition error: '+e.error+'. Check internet, microphone permission, Mac input/output devices, then retry.');if(['not-allowed','service-not-allowed'].includes(e.error))stopVoice();};recognition.onend=()=>{if(voiceActive&&!voiceBusy){setTimeout(()=>{if(voiceActive&&!voiceBusy&&recognition){try{recognition.start();}catch{}}},350);}};$('#agVoiceStart').disabled=true;$('#agVoiceStop').disabled=false;voiceStatus('Starting. The first spoken line identifies the assistant as AI and asks permission to continue.');const greeting=`Hello, this is the AI sales assistant for Dynamic Robotics 53 calling about ${$('#agProduct').value.trim()||'your enquiry'}. I am an AI assistant, not a human representative. Is it okay if I continue?`;voiceLog('AI',greeting);speakAndListen(greeting);}catch(e){voiceStatus(e.message);}};
  $('#agVoiceStop').onclick=stopVoice;
  // Clear browser speech/capture when navigating away from the agent page.
  window.addEventListener('beforeunload',stopVoice,{once:true});
}
async function custs(){const l=await api('GET','/customers');$('#view').innerHTML=`<div class="row"><input id="n" placeholder="Name"><input id="p" placeholder="Phone"><input id="e" placeholder="Email"><button class="b" id="add">Add customer</button><a class="pill" href="/api/customers.csv">Export CSV</a></div><div id="m"></div>`+(l.length?`<table><tr><th>Name</th><th>Phone</th><th>Email</th><th>Status</th><th></th></tr>${l.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.email)}</td><td><select data-id="${c.id}">${['New','Contacted','Interested','Follow-up Required','Callback Scheduled','Converted','Not Interested'].map(s=>`<option ${s==c.status?'selected':''}>${s}</option>`).join('')}</select></td><td><button data-contact="${esc(JSON.stringify({phone:c.phone,name:c.name,customerId:c.id,productInterest:c.product||''}))}" class="pill" style="cursor:pointer;background:none">Call</button> <button data-del="${c.id}" class="pill" style="cursor:pointer;background:none">Delete</button></td></tr>`).join('')}</table>`:'<div class="empty">No customers yet.</div>');
$('#add').onclick=async()=>{try{await api('POST','/customers',{name:$('#n').value,phone:$('#p').value,email:$('#e').value});custs()}catch(e){$('#m').innerHTML=`<p class="err">${esc(e.message)}</p>`}};
document.querySelectorAll('select[data-id]').forEach(s=>s.onchange=()=>api('PUT','/customers/'+s.dataset.id,{status:s.value}));
document.querySelectorAll('[data-contact]').forEach(b=>b.onclick=()=>{try{window.pre=JSON.parse(b.dataset.contact)}catch{window.pre={}}go('Call & Message')});
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this customer permanently?')){await api('DELETE','/customers/'+b.dataset.del+'?confirm=true');custs()}})}
async function calling(){
const [customers,calls,products,ai]=await Promise.all([api('GET','/customers'),api('GET','/calls'),api('GET','/products'),api('GET','/ai/status')]);
const pre=window.pre||{};window.pre=null;
const callRows=calls.length?calls.map(c=>`<tr><td>${esc(ist(c.createdAt))}</td><td>${esc(c.customerName||'—')}</td><td>${esc(c.phone)}</td><td>${c.status==='dial_opened'?'<span class="ok2">Phone opened</span>':`<span class="err">${esc(c.status)}</span>`}${c.error?`<div class="subtle">${esc(c.error)}</div>`:''}</td><td><select data-o="${c.id}">${['','answered','no_answer','busy','callback_requested','not_interested','wrong_number'].map(o=>`<option value="${o}" ${o==c.outcome?'selected':''}>${o||'— set outcome —'}</option>`).join('')}</select></td><td><input data-n="${c.id}" value="${esc(c.notes||'')}" placeholder="Notes"></td></tr>`).join(''):'<tr><td colspan="6" class="empty">No calls yet.</td></tr>';
const phoneHint=ai.online&&ai.modelReady?'Local AI is ready to draft a call script and customer message.':'Phone calls work without local AI. To draft scripts locally, start Ollama and install the configured model.';
$('#view').innerHTML=`<div class="card"><h3>Free native contact mode</h3><p class="subtle">Uses your Mac's Phone/FaceTime calling, Messages, WhatsApp and your existing phone/internet plan. No ElevenLabs or Twilio credentials are required by this screen. Apple Phone makes the call, but you speak to the customer yourself; local AI can prepare a script, not join the live cellular call.</p><p class="subtle">${esc(phoneHint)}</p>
<div class="fieldGrid"><select id="customerPick"><option value="">Enter a number manually…</option>${customers.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} · ${esc(c.phone||'no phone')}</option>`).join('')}</select><input id="contactName" placeholder="Customer name" value="${esc(pre.name||'')}"><input id="contactPhone" inputmode="tel" placeholder="+919876543210 or 10-digit mobile" value="${esc(pre.phone||'')}"><input id="productInterest" placeholder="Product / interest (e.g. Tap Tag Sticker)" value="${esc(pre.productInterest||'')}"><input id="callPurpose" placeholder="Call purpose (e.g. follow up on enquiry)" value="${esc(pre.purpose||'Follow up on existing enquiry')}"></div>
<label class="consent"><input id="contactConsent" type="checkbox"><span>I confirm this customer agreed to this follow-up and that I am permitted to contact them on the selected channel.</span></label></div>
<div class="actionGrid"><div class="card"><h3>1 · Call with Mac Phone</h3><p class="subtle">Opens the native macOS Phone app (macOS Tahoe 26+) or FaceTime/your configured phone handler on supported older setups. You confirm the call and speak to the customer. Normal carrier charges may apply under your existing plan.</p><div class="row"><button class="pill" id="draftCall" type="button">Generate call script with local AI</button><button class="pill" id="copyCall" type="button">Copy script</button></div><textarea id="callScript" rows="7" placeholder="Generate a short, accurate sales follow-up script here, or write your own…"></textarea><button class="b wide" id="startNativeCall" type="button">Open Mac Phone and call</button></div>
<div class="card"><h3>2 · Message customer</h3><div class="fieldGrid"><select id="messageChannel"><option value="whatsapp">WhatsApp</option><option value="messages">Mac Messages (SMS/iMessage)</option></select></div><textarea id="messageText" rows="6" maxlength="1600" placeholder="Write the message you want to send…"></textarea><div class="row"><button class="pill" id="draftMessage" type="button">Draft with local AI</button><button class="pill" id="copyMessage" type="button">Copy message</button><button class="b" id="openMessage" type="button">Open message app</button></div><p class="subtle">WhatsApp opens a prefilled chat. Mac Messages opens a new conversation where supported; message text is copied so you can paste it. Review and press Send yourself. SMS charges may depend on your carrier plan.</p></div></div>
<div id="actionResult" class="result" role="status" aria-live="polite"></div>
<h3>Native call history</h3><div class="card" style="overflow:auto"><table><thead><tr><th>Time</th><th>Customer</th><th>Phone</th><th>Dialer status</th><th>Outcome</th><th>Notes</th></tr></thead><tbody id="nativeCallRows">${callRows}</tbody></table></div>
<div class="card" style="margin-top:14px"><b>Zero provider setup</b><p class="subtle">You don't need ElevenLabs, Twilio or provider API keys for native calls and message handoff. For offline drafting, install Ollama and pull <code>qwen2.5:3b</code>. The app never claims a message was sent merely because it opened a compose window.</p></div>`;
const result=(msg,ok=false)=>{const el=$('#actionResult');el.className='result '+(ok?'good':'bad');el.textContent=msg;};
const normalizePhone=value=>{let n=String(value||'').trim().replace(/[\s()\-.]/g,'');if(/^\d{10}$/.test(n))n='+91'+n;else if(/^91\d{10}$/.test(n))n='+'+n;if(!/^\+[1-9]\d{7,14}$/.test(n))throw new Error('Enter a valid phone number, such as +919876543210 or a 10-digit Indian mobile.');return n;};
window.activeCustomerId=pre.customerId||'';
$('#customerPick').onchange=e=>{const c=customers.find(x=>x.id===e.target.value);if(!c){window.activeCustomerId='';return;}$('#contactName').value=c.name||'';$('#contactPhone').value=c.phone||'';$('#productInterest').value=c.product||'';window.activeCustomerId=c.id;};
if(pre.customerId)$('#customerPick').value=pre.customerId;
const buildPrompt=(kind)=>{const catalogue=products.filter(p=>p.active!==false).map(p=>`- ${p.name}: ₹${p.price}${p.priceType==='starting'?' (starting price)':''}. ${p.description}`).join('\n');return kind==='call'?`Write a natural 30–45 second phone call script for an AI sales assistant from Dynamic Robotics 53 to say. Clearly disclose early that the speaker is an AI assistant, ask permission to continue, and respect any refusal. Customer: ${$('#contactName').value||'customer'}. Interest: ${$('#productInterest').value||'their enquiry'}. Purpose: ${$('#callPurpose').value||'follow up on their existing enquiry'}. Start by asking if this is a convenient time. Use only verified facts from this catalogue; do not invent offers or claims. If a price is relevant, state it exactly. End with one simple question. Catalogue:\n${catalogue}`:`Draft one concise, friendly follow-up message for Dynamic Robotics 53. Customer: ${$('#contactName').value||'customer'}. Interest: ${$('#productInterest').value||'their enquiry'}. Purpose: ${$('#callPurpose').value||'follow up on their existing enquiry'}. Use only verified catalogue facts/prices. Do not invent discounts, features, delivery dates or promises. Under 500 characters; output only the message body. Catalogue:\n${catalogue}`;};
async function draftInto(kind,button){const el=kind==='call'?$('#callScript'):$('#messageText');const old=button.textContent;button.disabled=true;button.textContent='Drafting…';try{const r=await api('POST','/chat',{messages:[{role:'user',content:buildPrompt(kind)}]});el.value=(r.reply||'').trim();result('Draft ready. Review all facts and wording before using it.',true);}catch(e){result('Local AI could not draft this: '+e.message+' You can type the script/message manually.');}finally{button.disabled=false;button.textContent=old;}}
$('#draftCall').onclick=()=>draftInto('call',$('#draftCall'));
$('#draftMessage').onclick=()=>draftInto('message',$('#draftMessage'));
async function copyText(el,label){const text=el.value.trim();if(!text){result('Write or generate '+label.toLowerCase()+' first.');return;}try{await navigator.clipboard.writeText(text);result(label+' copied to the Mac clipboard.',true);}catch{result('Clipboard access was blocked by the browser. Select the text and copy it manually.');}}
$('#copyCall').onclick=()=>copyText($('#callScript'),'Call script');
$('#copyMessage').onclick=()=>copyText($('#messageText'),'Message');
$('#startNativeCall').onclick=async()=>{try{if(!$('#contactConsent').checked)throw new Error('Confirm that the customer agreed to this follow-up before opening the dialer.');const phone=normalizePhone($('#contactPhone').value);const btn=$('#startNativeCall');btn.disabled=true;btn.textContent='Opening Mac Phone…';const r=await api('POST','/calls/dial',{phone,customerName:$('#contactName').value,customerId:window.activeCustomerId||'',purpose:$('#callPurpose').value});const c=r.call;$('#nativeCallRows').insertAdjacentHTML('afterbegin',`<tr><td>${esc(ist(c.createdAt))}</td><td>${esc(c.customerName||'—')}</td><td>${esc(c.phone)}</td><td>${c.status==='dial_opened'?'<span class="ok2">Phone opened</span>':`<span class="err">${esc(c.status)}</span>`}</td><td><select data-o="${c.id}">${['','answered','no_answer','busy','callback_requested','not_interested','wrong_number'].map(o=>`<option value="${o}">${o||'— set outcome —'}</option>`).join('')}</select></td><td><input data-n="${c.id}" placeholder="Notes"></td></tr>`);wireCallHistory();result((r.message||'Phone app opened.')+' Read the script in the dashboard or speak naturally. The AI is not connected to live call audio.',true);}catch(e){result(e.message);}finally{const b=$('#startNativeCall');if(b){b.disabled=false;b.textContent='Open Mac Phone and call';}}};
$('#openMessage').onclick=async()=>{try{if(!$('#contactConsent').checked)throw new Error('Confirm that this customer agreed to receive this message.');const phone=normalizePhone($('#contactPhone').value);const message=$('#messageText').value.trim();if(!message)throw new Error('Write or generate a message first.');const channel=$('#messageChannel').value;if(channel==='whatsapp'){const digits=phone.replace(/\D/g,'');window.open('https://wa.me/'+digits+'?text='+encodeURIComponent(message),'_blank','noopener');result('WhatsApp chat opened with a prefilled draft. Review it and press Send in WhatsApp.',true);}else{try{await navigator.clipboard.writeText(message);}catch{throw new Error('Could not copy the message automatically. Use Copy message, then open Messages and paste it.');}const opened=await api('POST','/native/open-messages',{});result((opened.message||'Messages opened.')+' Start a new conversation with '+phone+', paste the copied text, review it and press Send.',true);}}catch(e){result(e.message);}};
function wireCallHistory(){document.querySelectorAll('[data-o]').forEach(s=>s.onchange=()=>api('PUT','/calls/'+s.dataset.o,{outcome:s.value}));document.querySelectorAll('[data-n]').forEach(i=>i.onchange=()=>api('PUT','/calls/'+i.dataset.n,{notes:i.value}));}
wireCallHistory();
}
async function dialer(){const [l,cs]=await Promise.all([api('GET','/calls'),api('GET','/customers')]);const pre=window.pre||['',''];window.pre=null;
const oc=['','answered','no_answer','busy','callback_requested','not_interested','wrong_number'];
$('#view').innerHTML=`<div class="card"><p class="pill" style="display:inline-block">Opens FaceTime / Phone on this Mac. Requires "Calls from iPhone" enabled and your iPhone nearby. You confirm each call yourself.</p>
<div class="row"><select id="cs"><option value="">Pick customer…</option>${cs.map(c=>`<option value="${esc(c.phone)}|${esc(c.name)}|${c.id}">${esc(c.name)}</option>`).join('')}</select><input id="ph" placeholder="+919876543210" value="${esc(pre[0])}"><input id="nm" placeholder="Name" value="${esc(pre[1])}"><input id="pu" placeholder="Purpose (e.g. Tap Tag enquiry)"><button class="b" id="dial">Open dialer</button></div><div id="m"></div></div>
<h3>Call log</h3>`+(l.length?`<table><tr><th>Time</th><th>Customer</th><th>Phone</th><th>Dialer</th><th>Outcome</th><th>Notes</th></tr>${l.map(c=>`<tr><td>${esc(ist(c.createdAt))}</td><td>${esc(c.customerName)}</td><td>${esc(c.phone)}</td><td>${c.status=='dial_opened'?'Dialer opened':'<span class=err>Failed</span>'}</td><td><select data-o="${c.id}">${oc.map(o=>`<option value="${o}" ${o==c.outcome?'selected':''}>${o||'— set outcome —'}</option>`).join('')}</select></td><td><input data-n="${c.id}" value="${esc(c.notes)}" placeholder="Notes"></td></tr>`).join('')}</table>`:'<div class="empty">No calls yet.</div>');
$('#cs').onchange=e=>{const v=e.target.value.split('|');if(v[0]){$('#ph').value=v[0];$('#nm').value=v[1];$('#nm').dataset.id=v[2]}};
$('#dial').onclick=async()=>{try{const r=await api('POST','/calls/dial',{phone:$('#ph').value,customerName:$('#nm').value,customerId:$('#nm').dataset.id||'',purpose:$('#pu').value});await dialer();$('#m').innerHTML=`<p class="ok2">${esc(r.message)}</p>`}catch(e){$('#m').innerHTML=`<p class="err">${esc(e.message)}</p>`}};
document.querySelectorAll('[data-o]').forEach(s=>s.onchange=()=>api('PUT','/calls/'+s.dataset.o,{outcome:s.value}));
document.querySelectorAll('[data-n]').forEach(i=>i.onchange=()=>api('PUT','/calls/'+i.dataset.n,{notes:i.value}))}
async function prods(){const l=await api('GET','/products');$('#view').innerHTML=`<table><tr><th>Product</th><th>Price</th><th>Type</th><th>Description</th></tr>${l.map(p=>`<tr><td>${esc(p.name)}</td><td>₹${p.price.toLocaleString('en-IN')}</td><td>${p.priceType=='starting'?'Starting price':'Fixed'}</td><td>${esc(p.description)}</td></tr>`).join('')}</table>`}
async function fups(){const l=await api('GET','/followups');$('#view').innerHTML=`<div class="row"><input id="t" placeholder="Follow-up task"><input id="d" type="datetime-local"><select id="pr"><option>medium</option><option>high</option><option>low</option></select><button class="b" id="add">Add</button></div><div id="m"></div>`+(l.length?`<table>${l.map(f=>`<tr><td>${f.done?'✓ ':''}${esc(f.title)}</td><td>${f.due?esc(ist(f.due)):''}</td><td>${f.priority}</td><td>${f.done?'':`<button class="pill" data-c="${f.id}" style="cursor:pointer;background:none">Complete</button>`}</td></tr>`).join('')}</table>`:'<div class="empty">No follow-ups.</div>');
$('#add').onclick=async()=>{try{await api('POST','/followups',{title:$('#t').value,due:$('#d').value?new Date($('#d').value).toISOString():null,priority:$('#pr').value});fups()}catch(e){$('#m').innerHTML=`<p class="err">${esc(e.message)}</p>`}};
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{await api('POST','/followups/'+b.dataset.c+'/complete');fups()})}
async function cbs(){const [l,s]=await Promise.all([api('GET','/callbacks'),api('GET','/settings')]);$('#view').innerHTML=`<p class="pill">Callback window: ${s.callbackStartHour}:00–${s.callbackEndHour}:00 IST</p><div class="row"><input id="cn" placeholder="Customer name"><input id="cd" type="date"><input id="ct" type="time"><input id="cr" placeholder="Reason"><button class="b" id="add">Book</button></div><div id="m"></div>`+(l.length?`<table>${l.map(c=>`<tr><td>${esc(c.customerName)}</td><td>${esc(ist(c.scheduledAt))}</td><td>${esc(c.reason)}</td><td>${c.status}</td><td>${c.status=='scheduled'?`<button class="pill" data-x="${c.id}" style="cursor:pointer;background:none">Cancel</button>`:''}</td></tr>`).join('')}</table>`:'<div class="empty">No callbacks.</div>');
$('#add').onclick=async()=>{try{const r=await api('POST','/callbacks',{customerName:$('#cn').value,date:$('#cd').value,time:$('#ct').value,reason:$('#cr').value});await cbs();$('#m').innerHTML=`<p class="ok2">Callback saved. ${r.notification.sent?'Mac notification sent.':'Notification not sent: '+esc(r.notification.reason)}</p>`}catch(e){$('#m').innerHTML=`<p class="err">${esc(e.message)}</p>`}};
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(confirm('Cancel this callback?')){await api('DELETE','/callbacks/'+b.dataset.x+'?confirm=true');cbs()}})}
async function act(){const l=await api('GET','/activity');$('#view').innerHTML=l.length?`<table>${l.map(a=>`<tr><td>${esc(ist(a.at))}</td><td>${esc(a.text)}</td></tr>`).join('')}</table>`:'<div class="empty">No activity yet.</div>'}
async function health(){try{const h=await api('GET','/health');const ok=h.ai.online&&h.ai.modelReady;$('#ai').innerHTML=`<i class="dot ${ok?'ok':''}"></i>Local AI: ${ok?'ready':esc(h.ai.message)}`}catch{$('#ai').innerHTML='<i class="dot"></i>Server offline'}}
setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata'})+' IST',1000);health();setInterval(health,15000);go('AI Sales Agent');
</script></body></html>
